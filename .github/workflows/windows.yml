name: Windows

on:
  push:
    branches:
      - '**' # Runs on push to any branch
    tags:
      - '*' # Runs on any tag push
  pull_request:
    branches:
      - main # Runs on pull requests targeting the main branch

jobs:

  build-windows:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    # This workflow explicitly selects the Visual Studio 2022 generator.
    # Pin the matching runner instead of following windows-latest to a newer
    # image that may no longer install Visual Studio 2022.
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build
        cmake -G "Visual Studio 17 2022" -A x64 .. 
        mkdir Release && cd Release
        curl -L https://openephys.jfrog.io/artifactory/GUI-binaries/Libraries/open-ephys-lib-v1.0.0.zip --output open-ephys-lib.zip 
        unzip open-ephys-lib.zip
      shell: bash
    - name: configure
      run: |
        cd Build
        cmake -G "Visual Studio 17 2022" -A x64 .. 
      shell: bash
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: build
      run: |
        msbuild Build/INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      shell: cmd
# TODO: Perform some basic testing before publishing...
#    - name: test
#      run: cd build && ctest
    - name: deploy
      if: github.ref == 'refs/heads/main'
      env:
        ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
        build_dir: "Build/Release"
        package: OpenEphysFFTW-windows
      run: |
        plugin_api=$(grep -rnw ../../plugin-GUI/Source -e '#define PLUGIN_API_VER' | grep -Eo "[0-9]*" | tail -1)
        tag=$(git describe --tags $(git rev-list --tags --max-count=1))
        new_plugin_ver=$tag-API$plugin_api
        mkdir shared
        cp -v $build_dir/*.dll shared
        if [ -d "libs" ]
        then
          cp -v libs/windows/bin/x64/*.dll shared
        fi
        zipfile=${package}_${new_plugin_ver}.zip
        powershell Compress-Archive -Path "shared" -DestinationPath ${zipfile}
        curl -H "X-JFrog-Art-Api:$ARTIFACTORY_ACCESS_TOKEN" -T $zipfile "https://openephys.jfrog.io/artifactory/OpenEphysFFTW-plugin/windows/$zipfile"
      shell: bash
