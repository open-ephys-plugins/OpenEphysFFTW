name: mac

on: 
  push:

jobs:

  build-mac:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
    - uses: actions/checkout@v1
    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git
        cd plugin-GUI/Build && cmake -G "Xcode" -DCMAKE_BUILD_TYPE=Release ..
    - name: build
      run: |
        cd Build
        cmake -G "Xcode" -DCMAKE_BUILD_TYPE=Release ..
        xcodebuild -configuration Release
        install_name_tool -change /usr/local/opt/fftw/lib/libfftw3.3.dylib @loader_path/libfftw3.3.dylib Release/libOpenEphysFFTW.dylib
#    - name: test
#      run: cd build && ctest
    - name: deploy
      env:
        artifactoryApiKey: ${{ secrets.artifactoryApiKey }}
        build_dir: "Build/Release"
        package: OpenEphysFFTW-mac
      run: |
        plugin_api=$(grep -rnw ../../plugin-GUI/Source -e '#define PLUGIN_API_VER' | grep -Eo "[0-9]" | tail -1)
        tag=$(git describe --tags $(git rev-list --tags --max-count=1))
        new_plugin_ver=$tag-API$plugin_api
        mkdir shared
        cp -r $build_dir/*.dylib shared
        cp -r libs/macos/bin/* shared
        zipfile=${package}_${new_plugin_ver}.zip
        zip -r -X $zipfile shared
        curl -H "X-JFrog-Art-Api:$artifactoryApiKey" -T $zipfile "https://openephys.jfrog.io/artifactory/OpenEphysFFTW-plugin/mac/$zipfile"