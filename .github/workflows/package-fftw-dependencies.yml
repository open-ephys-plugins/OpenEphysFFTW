name: package FFTW dependencies

on:
  push:
    branches:
      - "**"
    tags:
      - fftw-dependencies-3.3.11-1
    paths:
      - ".github/workflows/package-fftw-dependencies.yml"
      - "tools/PrepareFFTWBundle.cmake"
      - "DependencyTests/**"
  workflow_dispatch:
    inputs:
      stage_release:
        description: Stage the verified bundles as a draft dependency release
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/package-fftw-dependencies.yml"
      - "tools/PrepareFFTWBundle.cmake"
      - "DependencyTests/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            bundle_dir: fftw-3.3.11-linux-x86_64
          - os: macos-26
            platform: macos
            bundle_dir: fftw-3.3.11-macos-universal
          - os: windows-2025-vs2026
            platform: windows
            bundle_dir: fftw-3.3.11-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare verified dependency bundle
        run: >-
          cmake
          -DPLATFORM=${{ matrix.platform }}
          -DOUTPUT_DIR=${{ runner.temp }}/fftw-bundles
          -P tools/PrepareFFTWBundle.cmake

      - name: Configure smoke test
        if: matrix.platform != 'windows'
        run: >-
          cmake
          -S DependencyTests
          -B ${{ runner.temp }}/fftw-smoke-build
          -DFFTW_ROOT=${{ runner.temp }}/fftw-bundles/${{ matrix.bundle_dir }}

      - name: Configure smoke test with MSVC
        if: matrix.platform == 'windows'
        run: >-
          cmake
          -S DependencyTests
          -B ${{ runner.temp }}/fftw-smoke-build
          -G "Visual Studio 18 2026"
          -A x64
          -DFFTW_ROOT=${{ runner.temp }}/fftw-bundles/${{ matrix.bundle_dir }}

      - name: Build smoke test
        run: cmake --build ${{ runner.temp }}/fftw-smoke-build --config Release

      - name: Run smoke test
        run: ctest --test-dir ${{ runner.temp }}/fftw-smoke-build -C Release --output-on-failure

      - name: Inspect macOS deployment targets
        if: matrix.platform == 'macos'
        run: |
          for library in libfftw3.3.dylib libfftw3f.3.dylib; do
            path=${{ runner.temp }}/fftw-bundles/fftw-3.3.11-macos-universal/bin/$library
            architectures=$(lipo -archs "$path")
            metadata=$(xcrun vtool -show-build "$path")
            printf '%s\n' "$architectures" "$metadata"
            test "$architectures" = "x86_64 arm64"
            test "$(printf '%s\n' "$metadata" | grep -c 'minos 11.0')" -eq 2
          done

      - name: Upload bundle and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fftw-3.3.11-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/fftw-bundles/*.tar.gz
            ${{ runner.temp }}/fftw-bundles/*.sha256
          if-no-files-found: error
          retention-days: 14

  stage-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage_release) ||
      github.ref == 'refs/tags/fftw-dependencies-3.3.11-1'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fftw-3.3.11-*
          path: release-assets
          merge-multiple: true

      - name: Add corresponding FFTW source
        working-directory: release-assets
        run: |
          curl --fail --location --output fftw-3.3.11.tar.gz https://www.fftw.org/fftw-3.3.11.tar.gz
          echo "5630c24cdeb33b131612f7eb4b1a9934234754f9f388ff8617458d0be6f239a1  fftw-3.3.11.tar.gz" | sha256sum --check

      - name: Stage draft dependency release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create fftw-dependencies-3.3.11-1
          release-assets/*
          --repo ${{ github.repository }}
          --title "FFTW dependency bundles 3.3.11-1"
          --notes "Verified FFTW 3.3.11 shared-library bundles for Open Ephys builds. Each bundle contains the upstream license, provenance, and exact conda-forge build recipe. The corresponding FFTW source archive is attached to this release. Enable release immutability for the repository before publishing this draft."
          --draft
          --verify-tag
